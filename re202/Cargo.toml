[package]
name = "re202"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for the BOSS RE-202 Space Echo (dump/sync/diff/show/lint/schema/catalog/resolve)."

[[bin]]
name = "re202"
path = "src/main.rs"

[dependencies]
# The CLI is the generic engine; `re202` only wires its Device impl into `run`.
re202-core = { workspace = true, features = ["schema"] }
midi-access-cli = { workspace = true }
