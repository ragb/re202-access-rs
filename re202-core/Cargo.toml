[package]
name = "re202-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "BOSS RE-202 Space Echo SysEx codec (pure, no I/O)."

[features]
default = []
# Enabled by the wasm crate. Adds Tsify derives so types render as TS.
# (No `midi-access-core/tsify`: this crate's wasm surface uses only its own
# typed models, none of the kit's tsify types — pulling it in would leak unused
# kit interfaces like `RawByte` into the generated `.d.ts`.)
tsify = ["dep:tsify-next", "dep:wasm-bindgen"]
# Enabled by the CLI when emitting JSON Schema. Adds schemars derives.
schema = ["dep:schemars", "midi-access-core/schema"]

[dependencies]
midi-access-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tsify-next = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
